<!-- MÀN HÌNH ĐĂNG KÝ -->
        <div id="register-screen" class="screen" style="display: none !important;">
            <h1 class="page-title">Đăng ký tài khoản</h1>
            <p class="subtitle">Dành cho Sinh Viên (Email @tnut.edu.vn)</p>
            
            <div class="input-group mt-15">
                <label>Họ và tên</label>
                <input type="text" id="reg-fullname" placeholder="VD: Lê Hà Tuấn Kiệt">
            </div>
            
            <!-- Đã tách riêng Lớp và Mã Sinh Viên -->
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Lớp</label>
                    <input type="text" id="reg-class" placeholder="VD: K62.CDT.K02">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Mã sinh viên</label>
                    <input type="text" id="reg-studentid" placeholder="VD: K265520114109">
                </div>
            </div>

            <div class="input-group">
                <label>Email trường (@tnut.edu.vn)</label>
                <input type="email" id="reg-email" placeholder="VD: k265520114109@tnut.edu.vn">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="reg-password" placeholder="Tạo mật khẩu (từ 6 ký tự)...">
            </div>

            <p id="reg-error" class="text-danger" style="display: none; margin-bottom: 15px; font-size: 14px;"></p>
            <p id="reg-success" class="text-success" style="display: none; margin-bottom: 15px; font-size: 14px;">Đăng ký thành công! Đang chuyển về đăng nhập...</p>

            <button class="btn-primary" onclick="doRegister()">Tạo tài khoản</button>
            <button class="btn-outline" onclick="hideRegisterScreen()">Quay lại Đăng nhập</button>
        </div>
